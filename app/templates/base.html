<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TRAZA{% endblock %}</title>

    <!-- TailwindCSS -->
    <script src="/static/tailwindcss.min.js"></script>

    <!-- HTMX -->
    <script src="/static/htmx.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        traza: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        accent: {
                            green: '#059669',
                            amber: '#d97706',
                            red: '#dc2626',
                            blue: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>

    {% block head %}{% endblock %}
</head>
<body class="bg-traza-50 text-traza-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-traza-900 text-white shadow-lg sticky top-0 z-50" role="navigation" aria-label="Navegacion principal">
        <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">

                <!-- Logo + Toggle -->
                <div class="flex items-center gap-4">
                    <button id="sidebar-toggle" type="button"
                        class="lg:hidden p-1.5 rounded-md text-traza-400 hover:text-white hover:bg-traza-700 transition-colors"
                        aria-label="Toggle sidebar"
                        onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                    <a href="/" class="flex items-center gap-2 font-bold text-lg tracking-tight">
                        <svg class="w-7 h-7 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span>TRAZA</span>
                    </a>
                </div>

                <!-- Nav Links Desktop -->
                <div class="hidden lg:flex items-center gap-1" role="menubar">
                    <a href="/proyectos" role="menuitem"
                        class="nav-link px-3 py-2 rounded-md text-sm font-medium text-traza-300 hover:text-white hover:bg-traza-700 transition-colors"
                        hx-boost="true">
                        Proyectos
                    </a>
                    <a href="/dashboard" role="menuitem"
                        class="nav-link px-3 py-2 rounded-md text-sm font-medium text-traza-300 hover:text-white hover:bg-traza-700 transition-colors"
                        hx-boost="true">
                        Dashboard
                    </a>
                    <a href="/auditoria" role="menuitem"
                        class="nav-link px-3 py-2 rounded-md text-sm font-medium text-traza-300 hover:text-white hover:bg-traza-700 transition-colors"
                        hx-boost="true">
                        Auditoria
                    </a>
                </div>

                <!-- Right section -->
                <div class="flex items-center gap-3">
                    <span class="hidden sm:inline text-xs text-traza-500 font-mono" id="session-indicator"></span>
                    <div class="w-7 h-7 rounded-full bg-emerald-600 flex items-center justify-center text-xs font-bold"
                        title="Usuario activo">
                        U
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu (solo si JS habilitado) -->
    <div class="lg:hidden hidden" id="mobile-menu">
        <div class="bg-traza-800 px-2 pt-2 pb-3 space-y-1">
            <a href="/proyectos" class="block px-3 py-2 rounded-md text-base font-medium text-traza-300 hover:text-white hover:bg-traza-700">Proyectos</a>
            <a href="/dashboard" class="block px-3 py-2 rounded-md text-base font-medium text-traza-300 hover:text-white hover:bg-traza-700">Dashboard</a>
            <a href="/auditoria" class="block px-3 py-2 rounded-md text-base font-medium text-traza-300 hover:text-white hover:bg-traza-700">Auditoria</a>
        </div>
    </div>

    <!-- Main Layout: Sidebar + Content -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Sidebar -->
        <aside id="sidebar"
            class="fixed lg:static inset-y-0 left-0 z-40 w-56 bg-traza-100 border-r border-traza-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col pt-14 lg:pt-0"
            role="complementary" aria-label="Sidebar">

            <div class="p-4 border-b border-traza-200 hidden lg:flex items-center gap-2">
                <svg class="w-5 h-5 text-traza-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                </svg>
                <span class="text-sm font-semibold text-traza-600">Menu</span>
            </div>

            <nav class="flex-1 p-3 space-y-1 overflow-y-auto" role="navigation" aria-label="Sidebar navigation">
                <a href="/ing"
                    class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-traza-600 hover:bg-white hover:shadow-sm transition-all border-l-3 border-transparent hover:border-emerald-500"
                    hx-boost="true" hx-target="#main-content" hx-swap="innerHTML">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                    <span>ING</span>
                    <span class="ml-auto text-[10px] font-bold uppercase tracking-wider bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded">Entrada</span>
                </a>
                <a href="/proyectos"
                    class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-traza-600 hover:bg-white hover:shadow-sm transition-all"
                    hx-boost="true" hx-target="#main-content" hx-swap="innerHTML">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                    </svg>
                    Proyectos
                </a>
                <a href="/dashboard"
                    class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-traza-600 hover:bg-white hover:shadow-sm transition-all"
                    hx-boost="true" hx-target="#main-content" hx-swap="innerHTML">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                    Dashboard
                </a>
                <a href="/auditoria"
                    class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-traza-600 hover:bg-white hover:shadow-sm transition-all"
                    hx-boost="true" hx-target="#main-content" hx-swap="innerHTML">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Auditoria
                </a>
            </nav>

            <!-- Footer Sidebar -->
            <div class="p-3 border-t border-traza-200">
                <div class="text-xs text-traza-500 text-center">
                    TRAZA v1.0
                </div>
            </div>
        </aside>

        <!-- Overlay for mobile sidebar -->
        <div id="sidebar-overlay"
            class="fixed inset-0 bg-black bg-opacity-30 z-30 hidden lg:hidden"
            onclick="document.getElementById('sidebar').classList.add('-translate-x-full'); this.classList.add('hidden')">
        </div>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" role="main">
            {% block content %}{% endblock %}
        </main>

    </div>

    <!-- Notifications Container -->
    <div id="notifications-container"
        hx-get="/partials/notifications"
        hx-trigger="load, every 30s"
        hx-target="this"
        hx-swap="innerHTML"
        class="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm w-full">
    </div>

    <!-- Scripts base -->
    <script>
        // Sidebar toggle
        document.getElementById('sidebar-toggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });

        // Cerrar sidebar al hacer click en un link en mobile
        document.querySelectorAll('#sidebar a').forEach(function(link) {
            link.addEventListener('click', function() {
                if (window.innerWidth < 1024) {
                    document.getElementById('sidebar').classList.add('-translate-x-full');
                    document.getElementById('sidebar-overlay').classList.add('hidden');
                }
            });
        });

        // Session ID visual
        const sessionId = document.cookie.match(/session_id=([^;]+)/);
        if (sessionId) {
            document.getElementById('session-indicator').textContent =
                'Session: ' + sessionId[1].slice(0, 8) + '...';
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
