[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -v --tb=short --strict-markers
markers =
    unit: Tests unitarios rapidos
    integration: Tests de integracion con DB
    characterization: Tests de caracterizacion de extractores legacy
    e2e: Tests end-to-end de flujos completos
    slow: Tests lentos (OCR, extraccion de PDF grandes)
